[package]
name = "graph_view"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "graph_view.rs"

[features]
default = ["editor"]
editor = ["dep:editor", "dep:project", "dep:workspace", "dep:ui", "dep:zed_actions"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_flow = { workspace = true }
petgraph.workspace = true
util.workspace = true

editor = { workspace = true, optional = true }
project = { workspace = true, optional = true }
workspace = { workspace = true, optional = true }
ui = { workspace = true, optional = true }
zed_actions = { workspace = true, optional = true }

[dev-dependencies]
# Examples need a display backend on Linux (Wayland or X11); CI/desktop here uses X11.
gpui_platform = { workspace = true, default-features = false, features = ["x11"] }

[[example]]
name = "standalone_graph"
path = "examples/standalone_graph.rs"
required-features = []
